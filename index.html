<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cell Survivor</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <header>
        <div>
          <p class="eyebrow">MICROSCOPIC SURVIVAL</p>
          <h1>CELL SURVIVOR</h1>
        </div>
        <button id="pauseButton" type="button" aria-label="一時停止">Ⅱ</button>
      </header>
      <section class="hud" aria-label="ゲーム状況">
        <div><span>TIME</span><strong id="time">00:00</strong></div>
        <div><span>LEVEL</span><strong id="level">1</strong></div>
        <div><span>CELLS</span><strong id="kills">0</strong></div>
      </section>
      <div class="health-track" aria-label="体力"><div id="healthBar"></div></div>
      <div class="canvas-wrap">
        <canvas id="game" width="960" height="540"></canvas>
        <div id="startOverlay" class="overlay">
          <p class="eyebrow">SURVIVE THE PETRI DISH</p>
          <h2>細胞の海を、生き残れ。</h2>
          <p>移動するだけで自動攻撃。経験値を集めて進化しよう。</p>
          <button id="startButton" type="button">培養開始</button>
          <small>WASD / 矢印キーで移動</small>
        </div>
        <div id="upgradeOverlay" class="overlay hidden" role="dialog" aria-modal="true" aria-label="進化を選ぶ">
          <p class="eyebrow">CELL DIVISION</p>
          <h2>進化を選択</h2>
          <div id="upgradeChoices" class="choices"></div>
        </div>
        <div id="gameOverOverlay" class="overlay hidden">
          <p class="eyebrow">CULTURE COLLAPSED</p>
          <h2>培養失敗</h2>
          <p id="finalStats"></p>
          <button id="restartButton" type="button">もう一度培養する</button>
        </div>
      </div>
      <footer><span>自動発射</span><span>敵を倒して経験値を回収</span><span>PC: WASD / iPhone: 画面をドラッグ</span></footer>
    </main>
    <script src="game.js"></script>
  </body>
</html>
